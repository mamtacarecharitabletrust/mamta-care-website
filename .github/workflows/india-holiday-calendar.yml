name: India holiday calendar auto-refresh
on:
  # Public holiday data is computed ahead of time. No request-time API calls.
  schedule:
    - cron: "21 2 1 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate-occasion-dates.mjs
      - scripts/indian-holiday-candidates.py
      - .github/workflows/india-holiday-calendar.yml
permissions:
  contents: write
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source (trusted main branch only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install website dependencies
        run: npm ci --ignore-scripts
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned India holiday calendar library
        run: python -m pip install --disable-pip-version-check holidays==0.108
      - name: Generate India and state festival candidates
        run: python scripts/indian-holiday-candidates.py
      - name: Generate next six years of holiday dates
        run: node scripts/generate-occasion-dates.mjs
      - name: Verify registry and build
        run: |
          npm test
          npm run build
      - name: Publish calendar only when changed
        run: |
          if git diff --quiet -- src/data/occasionComputedDates.json; then
            echo "No holiday date changes; deployment not needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/occasionComputedDates.json
          git commit -m "chore: refresh calculated Indian festival dates"
          git push origin HEAD:main
