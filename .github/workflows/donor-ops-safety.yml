name: Donor Desk operations safety
on:
  pull_request:
    paths:
      - "cloudflare/donor-desk-ops-v1-addon.mjs"
      - "cloudflare/donor-desk-ops-console.html"
      - "cloudflare/migrations/20261114_donor_ops_v1.sql"
      - "tests/donor-ops-safety.test.mjs"
      - "cloudflare/donor-desk-v2-unified-addon.mjs"
      - "cloudflare/donor-desk-v2-unified-console.html"
      - "cloudflare/migrations/20261114_unified_donor_desk.sql"
      - "tests/donor-desk-unified-release.test.mjs"
      - "cloudflare/public-wig-intake-v3-addon.mjs"
      - "cloudflare/public-wig-intake-form.html"
      - "cloudflare/public-wig-intake-admin.html"
      - "cloudflare/migrations/20261114_public_wig_intakes.sql"
      - "tests/public-wig-intake-and-review-link.test.mjs"
      - "cloudflare/public-volunteer-referral-v4-addon.mjs"
      - "cloudflare/public-volunteer-referral-form.html"
      - "cloudflare/migrations/20261114_public_volunteer_referrals.sql"
      - "tests/public-volunteer-referral.test.mjs"
      - "cloudflare/approved-photo-source-reconciliation-v7-addon.mjs"
      - "cloudflare/approved-photo-source-reconciliation-v7-admin.html"
      - "tests/approved-photo-source-reconciliation.test.mjs"
      - "cloudflare/verified-email-relay-v8-addon.mjs"
      - "cloudflare/verified-email-relay-v8-admin.html"
      - "cloudflare/migrations/20261115_notification_relay.sql"
      - "apps-script/MamtaDeskNotificationRelay.gs"
      - "tests/verified-email-relay-outbox.test.mjs"
      - "cloudflare/verified-email-gated-expiry-v9-addon.mjs"
      - "cloudflare/verified-email-gated-expiry-v9-admin.html"
      - "tests/verified-email-gated-expiry.test.mjs"
      - "cloudflare/website-form-registration-autorecovery-v11.mjs"
      - "cloudflare/custom-photo-auto-link-v11-addon.mjs"
      - "cloudflare/custom-registration-sync-v11-admin.html"
      - "tests/custom-registration-auto-approval.test.mjs"
      - "cloudflare/patches/d1-row-read-hotfix-v12.mjs"
      - "tests/d1-row-read-hotfix.test.mjs"
      - "tests/registration-progress.test.mjs"
      - "src/styles/hair-registration.css"
      - "src/App.jsx"
      - "src/HairDonationRegistration.jsx"
      - "vercel.json"
      - "cloudflare/public-operational-impact-v6-addon.mjs"
      - "tests/public-operational-impact.test.mjs"
      - "src/WebsiteUpdates.jsx"
      - "src/styles/website-updates.css"
      - "cloudflare/public-hair-tracking-v5-addon.mjs"
      - "cloudflare/public-hair-tracking-form.html"
      - "cloudflare/migrations/20261115_public_tracking.sql"
      - "tests/public-hair-tracking.test.mjs"
      - ".github/workflows/donor-ops-safety.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check cloudflare/donor-desk-ops-v1-addon.mjs
      - run: npm test
      - run: npm run build
