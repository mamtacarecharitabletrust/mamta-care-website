name: Donor Desk operations safety
on:
  pull_request:
    paths:
      - "cloudflare/donor-desk-ops-v1-addon.mjs"
      - "cloudflare/donor-desk-ops-console.html"
      - "cloudflare/migrations/20261114_donor_ops_v1.sql"
      - "tests/donor-ops-safety.test.mjs"
      - "cloudflare/donor-desk-v2-unified-addon.mjs"
      - "cloudflare/donor-desk-v2-unified-console.html"
      - "cloudflare/migrations/20261114_unified_donor_desk.sql"
      - "tests/donor-desk-unified-release.test.mjs"
      - "cloudflare/public-wig-intake-v3-addon.mjs"
      - "cloudflare/public-wig-intake-form.html"
      - "cloudflare/public-wig-intake-admin.html"
      - "cloudflare/migrations/20261114_public_wig_intakes.sql"
      - "tests/public-wig-intake-and-review-link.test.mjs"
      - ".github/workflows/donor-ops-safety.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check cloudflare/donor-desk-ops-v1-addon.mjs
      - run: npm test
      - run: npm run build
