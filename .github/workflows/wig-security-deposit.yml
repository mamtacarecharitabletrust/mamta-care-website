name: Wig security deposit tests
on:
  pull_request:
    paths:
      - "cloudflare/wig-security-deposit.mjs"
      - "cloudflare/migrations/20261128_wig_security_deposit.sql"
      - "tests/wig-security-deposit.test.mjs"
      - "scripts/patch-wig-security-deposit.mjs"
      - ".github/workflows/wig-security-deposit.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: node --check cloudflare/wig-security-deposit.mjs
      - run: node --check scripts/patch-wig-security-deposit.mjs
      - run: node --test tests/wig-security-deposit.test.mjs
